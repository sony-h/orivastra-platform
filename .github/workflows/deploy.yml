name: Deploy (Manual)

on:
  # Automatic deploys are handled by VPS polling:
  # infrastructure/scripts/setup/poll-deploy.sh + systemd timer
  #
  # This workflow exists for manual emergency deploys
  # from the GitHub Actions UI (requires SSH access).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup & Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "=== Backup database ==="
            cd /opt/orivastra
            bash infrastructure/scripts/database/backup-db.sh

            echo "=== Deploy all applications ==="
            bash infrastructure/scripts/deploy/deploy-all.sh
